name: TP RSA tests et certificat
on:
  push:
    branches: [main]
    paths: ['TP_secu_1/**', '.github/workflows/tp-secu-1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-windows:
    runs-on: windows-latest
    env:
      TP_SANS_PAUSE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lancer le BAT depuis un chemin contenant des espaces
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'TP RSA test'
          Copy-Item -Path TP_secu_1 -Destination $destination -Recurse
          & "$destination\lancer_tests_complets.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Afficher les trois programmes dans la console Windows
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'TP RSA test'
          & "$destination\lancer_programmes.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-complets-windows
          path: ${{ runner.temp }}/TP RSA test/resultats/tests_windows/
          if-no-files-found: error
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests parties 1 2 et 3
        run: python TP_secu_1/Walter_Arthur_main.py --test
      - name: Simulation complète et message long
        run: |
          python TP_secu_1/Walter_Arthur_main.py --partie toutes --message "Bonjour Alice" --sortie TP_secu_1/resultats/ci_demo.json
          python TP_secu_1/Walter_Arthur_main.py --partie 3 --message "Un message long avec des accents é et un emoji 😀 pour vérifier le découpage UTF-8." --sortie TP_secu_1/resultats/ci_long.json
      - uses: actions/upload-artifact@v4
        with:
          name: resultats-python-${{ matrix.python }}
          path: TP_secu_1/resultats/ci_*.json
  certificat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dépendance du relevé X509
        run: python -m pip install -r TP_secu_1/requirements-certificat.txt
      - name: Tests de lecture des champs X509
        run: python TP_secu_1/outils/test_certificat.py
      - name: Observer Springer avec validation TLS
        id: observation
        continue-on-error: true
        run: python TP_secu_1/outils/observer_certificat.py --sortie TP_secu_1/resultats/certificat_springer.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificat-springer
          path: |
            TP_secu_1/resultats/certificat_springer.json
            TP_secu_1/resultats/certificat_springer.pem
          if-no-files-found: error
