<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club privé · {% if message %}Message du mois{% else %}Connexion{% endif %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f7f6f1; color: #192e29; font: 17px/1.5 "Segoe UI", sans-serif; }
  main { max-width: 42rem; margin: 3rem auto; padding: 0 2rem; }
  header { border-bottom: 2px solid #275646; padding-bottom: .6rem; font-weight: 650; }
  h1 { font: 2.35rem/1.15 Georgia, serif; margin: 1.4rem 0 .9rem; }
  .message { font: 1.7rem Consolas, monospace; }
  form { max-width: 23rem; } label { display: block; margin: .6rem 0 .15rem; }
  input { width: 100%; padding: .45rem; border: 1px solid #77897e; font: inherit; }
  button { margin-top: .8rem; padding: .5rem 1rem; background: #275646; color: white; border: 0; font: inherit; cursor: pointer; }
  [role=alert] { color: #9e3029; }
</style>
<main>
  <header>Club privé</header>
  {% if message %}
    <h1>Mot de passe du mois</h1>
    <p class="message">{{ message }}</p>
    {% if member %}<form action="/deconnexion" method="post"><button>Se déconnecter</button></form>{% endif %}
  {% else %}
    <h1>Connexion membre</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form action="/connexion" method="post">
      <label for="user">Identifiant</label><input id="user" name="username" autocomplete="username" required>
      <label for="pass">Mot de passe</label><input id="pass" type="password" name="password" autocomplete="current-password" required>
      <button>Se connecter</button>
    </form>
  {% endif %}
</main>
</html>
